<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            #root {
                width: 100%;
                height: 90vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f0f0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <button id="cut">cut</button>
        <script>
            class ImageMap {
                /**
                 * @param {HTMLImageElement} img
                 * @param {ImageConfigurator} parent
                 */
                constructor(img, parent) {
                    this.img = img;
                    this.parent = parent;
                }

                render() {
                    const img = document.createElement("img");
                    img.src = this.imageUrl;
                    img.alt = "Imagen de Simorgh";
                    this.root.appendChild(img);
                }
            }
            // una clase para configurar el patron con la imagen
            class ImageConfigurator {
                /**
                 * @param {HTMLElement} root - Elemento raíz donde se montará el componente.
                 * @param {string} imageUrl - URL de la imagen a mostrar.
                 */
                constructor(root, imageUrl) {
                    this.root = root;
                    this.imageUrl = imageUrl;
                    this.canvas = document.createElement("canvas");
                    this.canvas.width = root.getBoundingClientRect().width;
                    this.canvas.height = root.getBoundingClientRect().height;
                    this.root.appendChild(this.canvas);
                    /*
                     * @type {CanvasRenderingContext2D}
                     */
                    this.ctx = this.canvas.getContext("2d");
                }

                render() {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.src = this.imageUrl;
                        img.onload = () => {
                            this.ctx.drawImage(
                                img,
                                0,
                                0,
                                img.width,
                                img.height,
                                0,
                                0,
                                (this.canvas.width / this.canvas.height) * img.width,
                                this.canvas.height
                            );
                            resolve();
                        };
                        const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                        let pixelSize = 4;
                        let width = 100;
                        let height = 100;
                        const data = imageData.data;

                        for (let y = 0; y < height; y += pixelSize) {
                            for (let x = 0; x < width; x += pixelSize) {
                                const i = (y * width + x) * 4;
                                const r = data[i];
                                const g = data[i + 1];
                                const b = data[i + 2];
                                const a = data[i + 3];

                                // rellenar bloque de pixelSize x pixelSize
                                for (let dy = 0; dy < pixelSize; dy++) {
                                    for (let dx = 0; dx < pixelSize; dx++) {
                                        const j = ((y + dy) * width + (x + dx)) * 4;
                                        if (j < data.length) {
                                            data[j] = r;
                                            data[j + 1] = g;
                                            data[j + 2] = b;
                                            data[j + 3] = a;
                                        }
                                    }
                                }
                            }
                        }
                        this.ctx.putImageData(imageData, 0, 0);
                        img.onerror = (error) => {
                            reject(error);
                        };
                    });
                }
            }

            class ImageCuter {
                /**
                 * @param {string} imgSrc
                 * @param {HTMLElement} root
                 */
                constructor(root, imgSrc) {
                    this.imgSrc = imgSrc;
                    this.root = root;
                    this.mosueDown = false;
                    this.canvas = document.createElement("canvas");
                    this.canvas.width = root.getBoundingClientRect().width;
                    this.canvas.height = root.getBoundingClientRect().height;
                    this.root.appendChild(this.canvas);
                    /**
                     * @type {CanvasRenderingContext2D}
                     */
                    this.ctx = this.canvas.getContext("2d");
                    this.canvasSecond = document.createElement("canvas");
                    this.canvasSecond.width = root.getBoundingClientRect().width;
                    this.canvasSecond.height = root.getBoundingClientRect().height;
                    this.root.appendChild(this.canvasSecond);
                    /**
                     * @type {CanvasRenderingContext2D}
                     */
                    this.ctxSecond = this.canvasSecond.getContext("2d");

                    this.canvas.style.position = "absolute";
                    this.canvas.style.top = "0";
                    this.canvas.style.left = "0";
                    this.canvasSecond.style.position = "absolute";
                    this.canvasSecond.style.top = "0";
                    this.canvasSecond.style.left = "0";
                }

                draw() {
					this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.drawImage(
                        this.img,
                        0,
                        0,
                        this.img.width,
                        this.img.height,
                        this.imagePos.x,
                        this.imagePos.y,
                        this.imagePos.width,
                        this.imagePos.height
                    );
                    this.ctxSecond.fillStyle = "#0000007d";
                    this.ctxSecond.fillRect(0, 0, this.canvasSecond.width, this.canvasSecond.height);
                    this.ctxSecond.clearRect(
                        this.cuterPos.x,
                        this.cuterPos.y,
                        this.cuterPos.width,
                        this.cuterPos.height
                    );
                    this.cuter.top.style.top = `${this.cuterPos.y}px`;
                    this.cuter.top.style.left = `${this.cuterPos.x}px`;
                    this.cuter.top.style.width = `${this.cuterPos.width}px`;
                    this.cuter.bottom.style.top = `${this.cuterPos.y + this.cuterPos.height}px`;
                    this.cuter.bottom.style.left = `${this.cuterPos.x}px`;
                    this.cuter.bottom.style.width = `${this.cuterPos.width + this.cuter.lineWidth}px`;
                    this.cuter.left.style.top = `${this.cuterPos.y}px`;
                    this.cuter.left.style.left = `${this.cuterPos.x}px`;
                    this.cuter.left.style.height = `${this.cuterPos.height}px`;
                    this.cuter.right.style.top = `${this.cuterPos.y}px`;
                    this.cuter.right.style.left = `${this.cuterPos.x + this.cuterPos.width}px`;
                    this.cuter.right.style.height = `${this.cuterPos.height}px`;
                    this.cuter.top.style.height = `${this.cuter.lineWidth}px`;
                    this.cuter.bottom.style.height = `${this.cuter.lineWidth}px`;
                    this.cuter.left.style.width = `${this.cuter.lineWidth}px`;
                    this.cuter.right.style.width = `${this.cuter.lineWidth}px`;
                }

                render() {
                    return new Promise((resolve, reject) => {
                        this.img = new Image();
                        this.img.src = this.imgSrc;
                        this.img.onload = () => {
                            if (this.img.width < this.img.height) {
                                this.imagePos = {
                                    x:
                                        this.canvas.width / 2 -
                                        ((this.img.width / this.img.height) * (this.canvas.height * 0.9)) / 2,
                                    y: this.canvas.height * 0.05,
                                    width: (this.img.width / this.img.height) * (this.canvas.height * 0.9),
                                    height: this.canvas.height * 0.9,
                                };
                                this.cuterPos = {
                                    x:
                                        this.canvas.width / 2 -
                                        ((this.img.width / this.img.height) * (this.canvas.height * 0.9)) / 2,
                                    y: this.canvas.height * 0.05,
                                    width: (this.img.width / this.img.height) * (this.canvas.height * 0.9),
                                    height: this.canvas.height * 0.9,
                                };
                            } else {
                                this.imagePos = {
                                    x: this.canvas.width * 0.05,
                                    y:
                                        this.canvas.height / 2 -
                                        ((this.img.height / this.img.width) * (this.canvas.width * 0.9)) / 2,
                                    width: this.canvas.width * 0.9,
                                    height: (this.img.height / this.img.width) * (this.canvas.width * 0.9),
                                };
                                this.cuterPos = {
                                    x: this.canvas.width * 0.05,
                                    y:
                                        this.canvas.height / 2 -
                                        ((this.img.height / this.img.width) * (this.canvas.width * 0.9)) / 2,
                                    width: this.canvas.width * 0.9,
                                    height: (this.img.height / this.img.width) * (this.canvas.width * 0.9),
                                };
                            }
                            this.cuter = {
                                lineWidth: 5,
                                top: document.createElement("div"),
                                bottom: document.createElement("div"),
                                left: document.createElement("div"),
                                right: document.createElement("div"),
                            };
                            this.cuter.top.className = "cuter";
                            this.cuter.bottom.className = "cuter";
                            this.cuter.left.className = "cuter";
                            this.cuter.right.className = "cuter";
                            this.cuter.top.style.position = "absolute";
                            this.cuter.bottom.style.position = "absolute";
                            this.cuter.left.style.position = "absolute";
                            this.cuter.right.style.position = "absolute";
                            this.cuter.top.style.cursor = "ns-resize";
                            this.cuter.bottom.style.cursor = "ns-resize";
                            this.cuter.left.style.cursor = "ew-resize";
                            this.cuter.right.style.cursor = "ew-resize";
                            this.cuter.top.addEventListener("mousedown", (e) => {
                                this.mosueDown = "top";
                                this.cuterPosCopy = {
                                    ...this.cuterPos,
                                };
                            });
                            this.cuter.bottom.addEventListener("mousedown", (e) => {
                                this.mosueDown = "bottom";
                                this.cuterPosCopy = {
                                    ...this.cuterPos,
                                };
                            });
                            this.cuter.left.addEventListener("mousedown", (e) => {
                                this.mosueDown = "left";
                                this.cuterPosCopy = {
                                    ...this.cuterPos,
                                };
                            });
                            this.cuter.right.addEventListener("mousedown", (e) => {
                                this.mosueDown = "right";
                                this.cuterPosCopy = {
                                    ...this.cuterPos,
                                };
                            });
                            this.cuter.top.addEventListener("mouseup", (e) => {
                                this.mosueDown = false;
                            });
                            this.cuter.bottom.addEventListener("mouseup", (e) => {
                                this.mosueDown = false;
                            });
                            this.cuter.left.addEventListener("mouseup", (e) => {
                                this.mosueDown = false;
                            });
                            this.cuter.right.addEventListener("mouseup", (e) => {
                                this.mosueDown = false;
                            });
                            this.root.addEventListener("mousemove", (e) => {
                                if (this.mosueDown) {
                                    const rect = this.canvas.getBoundingClientRect();
                                    const mouseX = e.clientX - rect.left;
                                    const mouseY = e.clientY - rect.top;
                                    if (this.mosueDown === "top" && mouseY > this.imagePos.y) {
                                        this.cuterPos.y = mouseY;
                                        this.cuterPos.height =
                                            this.cuterPosCopy.y + this.cuterPosCopy.height - this.cuterPos.y;
                                    } else if (
                                        this.mosueDown === "bottom" &&
                                        mouseY < this.imagePos.y + this.imagePos.height
                                    ) {
                                        this.cuterPos.height = mouseY - this.cuterPos.y;
                                    } else if (this.mosueDown === "left" && mouseX > this.imagePos.x) {
                                        this.cuterPos.x = mouseX;
                                        this.cuterPos.width =
                                            this.cuterPosCopy.x + this.cuterPosCopy.width - this.cuterPos.x;
                                    } else if (
                                        this.mosueDown === "right" &&
                                        mouseX < this.imagePos.x + this.imagePos.width
                                    ) {
                                        this.cuterPos.width = mouseX - this.cuterPos.x;
                                    }
                                    this.draw();
                                }
                            });
                            this.cuter.top.style.backgroundColor = "#ffffff";
                            this.cuter.bottom.style.backgroundColor = "#ffffff";
                            this.cuter.left.style.backgroundColor = "#ffffff";
                            this.cuter.right.style.backgroundColor = "#ffffff";
                            this.root.appendChild(this.cuter.top);
                            this.root.appendChild(this.cuter.bottom);
                            this.root.appendChild(this.cuter.left);
                            this.root.appendChild(this.cuter.right);
                            this.draw();
                            resolve();
                        };
                        this.img.onerror = (error) => {
                            reject(error);
                        };
                    });
                }

                cut() {
					this.img.crossOrigin = "Anonymous"; // Asegúrate de que la imagen se pueda cargar desde otro dominio
                    const cutCanvas = document.createElement("canvas");
                    cutCanvas.width = this.cuterPos.width;
                    cutCanvas.height = this.cuterPos.height;
                    const cutCtx = cutCanvas.getContext("2d");
                    console.log(this.cuterPos);
                    cutCtx.drawImage(
                        this.img,
                        this.cuterPos.x,
                        this.cuterPos.y,
                        this.cuterPos.width,
                        this.cuterPos.height,
                        0,
                        0,
                        this.cuterPos.width,
                        this.cuterPos.height
                    );
                    return cutCanvas.toDataURL();
                }
            }
            const root = document.getElementById("root");
            const imageUrl = "https://sitotravel.com/wp-content/uploads/2021/07/simorgh.jpg"; // Reemplaza con la URL de tu imagen
            const configurator = new ImageCuter(root, imageUrl);
            configurator
                .render()
                .then(() => {
                    console.log("Imagen cargada y renderizada correctamente");
                })
                .catch((error) => {
                    console.error("Error al cargar la imagen:", error);
                });
            document.getElementById("cut").addEventListener("click", () => {
				console.log(configurator.cut())
                open(configurator.cut());
            });
            console.log(configurator);
        </script>
    </body>
</html>
